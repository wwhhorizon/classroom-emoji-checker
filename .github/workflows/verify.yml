name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  sqlite-and-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m pytest -q --junitxml=artifacts/pytest-results.xml
      - run: python scripts/export_contract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/pytest-results.xml
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: emoji_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      EMOJI_TEST_DATABASE_URL: mysql+pymysql://root:test-root-password@127.0.0.1:3306/emoji_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m pytest tests/test_backend.py -q
